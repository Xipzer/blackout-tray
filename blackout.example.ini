; Copy to blackout.ini beside blackout.exe. Every section is optional; leave a section out to disable that feature.

[rgb]
; OpenRGB CLI used for one-shot RGB changes. Leave empty to skip OpenRGB.
openrgb=%LOCALAPPDATA%\OpenRGB\OpenRGB Windows 64-bit\OpenRGB.exe
; OpenRGB arguments for off and on. Device names are matched by substring.
off=--noautoconnect -d "Commander Pro" -m Static -c 000000 -d "Lighting Node" -m Static -c 000000 -d ASRock -m Off -d "RTX 5090" -m Off -d Goliathus -m Off -d Blackwidow -m Off
on=--noautoconnect -d "Commander Pro" -m Static -c FF0000 -d "Lighting Node" -m Static -c FF0000 -d ASRock -m Static -c FF0000 -d "RTX 5090" -m Off -d Goliathus -m Static -c FF0000 -d Blackwidow -m Static -c FF0000
; Optional extra steps, run after the first. Put devices that are sometimes missing (wireless, speakers) here,
; because one missing device makes OpenRGB fail the whole step.
off2=--noautoconnect -d G560 -m Off
on2=--noautoconnect -d G560 -m Static -c FF0000
; Colour for the iCUE LINK hub and the FURY module when on.
color=FF0000

[link]
; LED count on the iCUE LINK chain (XD5 Elite = 22). 0 or missing disables the hub keep-alive.
leds=22

[ddc]
; Hardware IDs of monitors to power off over DDC/CI while the screens are off. Comma separated.
monitors=BNQ7F2F
; Sleep value: 4 = standby (default, wakes over DDC), 5 = hard off (some monitors then need the power button).
off=4

[fans]
; Fan curve: one temperature drives up to 7 fans. Hardware comes from the files in the devices folder (docs/devices.md).
; Motherboard fan headers need PawnIO installed, LpcIO.bin beside blackout.exe (or module=) and Blackout running as admin.
; Run "blackout.exe --devices" as admin to see the fans and temperatures on this PC.
; Fans to drive: <definition>/<fan number or name>. sio = the motherboard fan chip that was found.
outputs=sio/2,sio/4,sio/5
; Temperature to follow: link (default) = the iCUE LINK hub's coolant sensor (XD5, XD6, ...), or <definition>/<name>.
;source=sio/AUXTIN2
; Allow control through a definition marked status=untested.
;untested=1
; Temperature C : duty %, straight lines between points. Below the first point = first duty, above the last = last duty.
curve=30:40,45:100
; Cap on every duty, e.g. 80 while fans draw power from 1 A motherboard headers. Default 100.
;max=80
; Panel labels for the fans, in the order of outputs=.
;names=Top,Side,Bottom
; Fans slow down only once the temperature is this many C lower.
hysteresis=2
; With source=link: temperature sensor index on the hub. -1 (default) = first present sensor.
;sensor=-1
;module=%LOCALAPPDATA%\OpenRGB\OpenRGB Windows 64-bit\LpcIO.bin
