[device]
name=ITE IT8613E
type=sio
status=untested
tested=
source=Linux drivers/hwmon/it87.c, frankcrawford/it87 it87.c, LibreHardwareMonitor IT87XX.cs, LpcIO.cs, Chip.cs
family=ite
chip=8613
ldn=04
; No control while all fans are off with active-low polarity (reg 14): the
; BIOS left the fan outputs unconfigured (Linux it87_check_pwm).
guard=14:87!=00

[fans]
; The chip has no fan 1 (Linux).
; Fan 2 to 5 exist only if the board routes those pins.
; Fan 4 and 5: read only. Linux puts their mode in 1E and 1F,
; LibreHardwareMonitor uses 7F for fan 4 and has no fifth control.
Fan 2=duty:6B mode:16 manual:80=00 rpm:0E,19
Fan 3=duty:73 mode:17 manual:80=00 rpm:0F,1A
Fan 4=rpm:80,81
Fan 5=rpm:82,83

[temps]
; LibreHardwareMonitor also reads 2C. Linux knows three inputs.
Temp 1=29
Temp 2=2A
Temp 3=2B
