; Aquacomputer Quadro fan controller. Monitor only.
; The controller sends input report 01 every second on its own, no init command.
;
; Offsets: numbered reports. aquacomputer_d5next.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 01 at index 0, the same as Windows. No conversion.
; RPM = fan block start + 8: blocks at 70, 7D, 8A, 97 give 120, 133, 146, 159.
; Temperature sensors start at 34 = 52, two bytes each.
; in: the status report is DC = 220 bytes including the report ID.
;
; id= and out= are left out: the sources define no output report. Speed is set
; through feature report 03 (961 bytes, CRC-16/USB), which this format cannot send.
; The 16 software sensors (3C onward) and the flow sensor (6E) are left out.

[device]
name=Aquacomputer Quadro
type=hid
status=untested
tested=
source=linux drivers/hwmon/aquacomputer_d5next.c, liquidctl liquidctl/driver/aquacomputer.py, liquidctl docs/developer/protocol/aquacomputer.md
vid=0C70
pid=F00D
in=219

[fans]
listen=1
match=01
Fan 1=u16be@120
Fan 2=u16be@133
Fan 3=u16be@146
Fan 4=u16be@159

[temps]
listen=1
match=01
invalid=7FFF
Sensor 1=u16be@52 /100
Sensor 2=u16be@54 /100
Sensor 3=u16be@56 /100
Sensor 4=u16be@58 /100
