[device]
name=ITE IT8622E
type=sio
status=untested
tested=
source=Linux drivers/hwmon/it87.c, frankcrawford/it87 it87.c
family=ite
chip=8622
ldn=04
; No control while all fans are off with active-low polarity (reg 14): the
; BIOS left the fan outputs unconfigured (Linux it87_check_pwm).
guard=14:87!=00

[fans]
; Fan 2 to 5 exist only if the board routes those pins.
Fan 1=duty:63 mode:15 manual:80=00 rpm:0D,18
Fan 2=duty:6B mode:16 manual:80=00 rpm:0E,19
Fan 3=duty:73 mode:17 manual:80=00 rpm:0F,1A
Fan 4=duty:7B mode:1E manual:80=00 rpm:80,81
Fan 5=duty:A3 mode:1F manual:80=00 rpm:82,83

[temps]
Temp 1=29
Temp 2=2A
Temp 3=2B
Temp 4=2C
