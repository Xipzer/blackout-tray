; NZXT Kraken X42, X52, X62, X72 (third generation). Monitor only.
; The cooler sends input report 04 twice a second on its own, no init command.
;
; Offsets: numbered reports. nzxt-kraken2.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 04 at index 0, the same as Windows. No conversion.
; in: liquidctl reads 64 bytes including the report ID. out: it writes 65 bytes
; including report ID 02.
;
; Temperature: byte 1 is whole degrees C, byte 2 is tenths. Only byte 1 is used here.
; No set=: duty goes through per channel curve writes that depend on the firmware version.

[device]
name=NZXT Kraken X42/X52/X62/X72
type=hid
status=untested
tested=
source=linux drivers/hwmon/nzxt-kraken2.c, liquidctl liquidctl/driver/kraken2.py
vid=1E71
pid=170E
id=02
out=64
in=63

[fans]
listen=1
match=04
Fan=u16be@3
Pump=u16be@5

[temps]
listen=1
match=04
Coolant=u8@1
