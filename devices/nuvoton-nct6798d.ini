; D42B is the LibreHardwareMonitor ID. D428 and D429 are the Linux ones (NCT6798D/NCT5585D).
; D42A has its own file (nuvoton-nct6796d-r.ini).
[device]
name=Nuvoton NCT6798D
type=sio
status=untested
tested=
source=Linux nct6775-core.c, nct6775-platform.c, nct6775.h. LibreHardwareMonitor Nct677X.cs, LpcIO.cs, Chip.cs
family=nuvoton
chip=D428,D429,D42B
ldn=0B
iolock=1

[fans]
; Channels 3 and up work only if the board routes those pins.
Fan 1=duty:109 mode:102 manual:F0=00 rpm:4C0
Fan 2=duty:209 mode:202 manual:F0=00 rpm:4C2
Fan 3=duty:309 mode:302 manual:F0=00 rpm:4C4
Fan 4=duty:809 mode:802 manual:F0=00 rpm:4C6
Fan 5=duty:909 mode:902 manual:F0=00 rpm:4C8
Fan 6=duty:A09 mode:A02 manual:F0=00 rpm:4CA
Fan 7=duty:B09 mode:B02 manual:F0=00 rpm:4CE

[temps]
; Fixed per-input readings, whole degrees.
SYSTIN=490
CPUTIN=491
AUXTIN0=492
AUXTIN1=493
AUXTIN2=494
AUXTIN3=495
; AMD TSI reading. 0 when unused (Intel boards).
TSI0_TEMP=409,40A.7
