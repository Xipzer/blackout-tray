[device]
name=Fintek F71808A
type=sio
status=untested
tested=
source=Linux drivers/hwmon/f71882fg.c
family=fintek
chip=1001
ldn=04

[fans]
; RPM only. Control needs mode register 96, shared by all fans
; (two bits per fan).
; Fan 3 has a plain PWM register only (C3), no automatic mode.
Fan 1=rpm:A0
Fan 2=rpm:B0
Fan 3=rpm:C0

[temps]
Temp 1=72
Temp 2=74
