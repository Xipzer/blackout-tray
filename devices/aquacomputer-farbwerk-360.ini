; Aquacomputer Farbwerk 360 RGB controller. Temperatures only, it has no fan outputs.
; The controller sends input report 01 every second on its own, no init command.
;
; Offsets: numbered reports. aquacomputer_d5next.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 01 at index 0, the same as Windows. No conversion.
; Temperature sensors start at 32 = 50, two bytes each.
; in: the status report is B6 = 182 bytes including the report ID.
;
; id= and out= are left out: the sources define no output report.
; The 16 software sensors (3A onward) are left out; they are fed by host software.

[device]
name=Aquacomputer Farbwerk 360
type=hid
status=untested
tested=
source=linux drivers/hwmon/aquacomputer_d5next.c, liquidctl liquidctl/driver/aquacomputer.py, liquidctl docs/developer/protocol/aquacomputer.md
vid=0C70
pid=F010
in=181

[temps]
listen=1
match=01
invalid=7FFF
Sensor 1=u16be@50 /100
Sensor 2=u16be@52 /100
Sensor 3=u16be@54 /100
Sensor 4=u16be@56 /100
