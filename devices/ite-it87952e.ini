[device]
name=ITE IT87952E
type=sio
status=untested
tested=
source=Linux drivers/hwmon/it87.c, frankcrawford/it87 it87.c, LibreHardwareMonitor IT87XX.cs, LpcIO.cs, Chip.cs
family=ite
chip=8695
ldn=04
; No control while all fans are off with active-low polarity (reg 14): the
; BIOS left the fan outputs unconfigured (Linux it87_check_pwm).
guard=14:87!=00

[fans]
; Second chip on Gigabyte boards, config port 4E. The BIOS leaves it in
; config mode. Blackout asks for the ID before it sends any key, and never
; sends the exit sequence to port 4E.
; Gigabyte's fan firmware on this chip overrides duty writes until it is
; switched off (byte 947 of the chip's RAM, out of reach of this format).
; Fan 1 to 3 follow the duty only while their bit in reg 13 is set (enable).
Fan 1=duty:63 mode:15 manual:80=00 enable:13.0 rpm:0D,18
Fan 2=duty:6B mode:16 manual:80=00 enable:13.1 rpm:0E,19
Fan 3=duty:73 mode:17 manual:80=00 enable:13.2 rpm:0F,1A

[temps]
Temp 1=29
Temp 2=2A
Temp 3=2B
