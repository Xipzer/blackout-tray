; Aquacomputer D5 Next pump. Monitor only.
; The pump sends input report 01 every second on its own, no init command.
;
; Offsets: numbered reports. aquacomputer_d5next.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 01 at index 0, the same as Windows. No conversion.
; RPM = fan block start + 8: pump 6C + 8 = 116, fan 5F + 8 = 103. Coolant is at 57 = 87.
; in: the status report is 9E = 158 bytes including the report ID.
;
; id= and out= are left out: the sources define no output report. Speed is set
; through feature report 03 (809 bytes, CRC-16/USB), which this format cannot send.
; The 8 software sensors (3F to 4D) are left out; they are fed by host software.

[device]
name=Aquacomputer D5 Next
type=hid
status=untested
tested=
source=linux drivers/hwmon/aquacomputer_d5next.c, liquidctl liquidctl/driver/aquacomputer.py, liquidctl docs/developer/protocol/aquacomputer.md
vid=0C70
pid=F00E
in=157

[fans]
listen=1
match=01
Pump=u16be@116
Fan=u16be@103

[temps]
listen=1
match=01
invalid=7FFF
Coolant=u16be@87 /100
