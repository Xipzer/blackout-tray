; Aquacomputer Farbwerk RGB controller. Temperatures only, it has no fan outputs.
; The controller sends input report 01 every second on its own, no init command.
;
; Offsets: numbered reports. aquacomputer_d5next.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 01 at index 0, the same as Windows. No conversion.
; Temperature sensors start at 2F = 47, two bytes each.
; in: liquidctl reads B6 = 182 bytes including the report ID. Only liquidctl gives
; this length; the kernel driver needs at least 55 bytes.
;
; id= and out= are left out: the sources define no output report.

[device]
name=Aquacomputer Farbwerk
type=hid
status=untested
tested=
source=linux drivers/hwmon/aquacomputer_d5next.c, liquidctl liquidctl/driver/aquacomputer.py
vid=0C70
pid=F00A
in=181

[temps]
listen=1
match=01
invalid=7FFF
Sensor 1=u16be@47 /100
Sensor 2=u16be@49 /100
Sensor 3=u16be@51 /100
Sensor 4=u16be@53 /100
