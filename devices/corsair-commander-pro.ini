; Corsair Commander Pro, also the one built into the Obsidian 1000D case (pid 1D00).
; Command and reply. Every command, set included, is answered by one 16 byte input report.
;
; Offsets: the device uses unnumbered reports. corsair-cpro.c (raw_event buffer) and
; liquidctl (hidapi read) both see the reply without a report ID byte: status at 0,
; data at 1 and 2. Windows puts report ID 00 in front, so status is at 1 and data at 2 and 3.
; Status 00 = ok. A temperature probe that is not connected answers status 11 and
; no valid data; this format has no status check.
;
; out: liquidctl writes 64 bytes after the report ID byte. corsair-cpro.c sends 63.
; Fan duty is 0 to 100. Temperature is a signed 16 bit value in 1/100 C.

[device]
name=Corsair Commander Pro
type=hid
status=untested
tested=
source=linux drivers/hwmon/corsair-cpro.c, liquidctl liquidctl/driver/commander_pro.py
vid=1B1C
pid=0C10,1D00
id=00
out=64
in=16

[fans]
count=6
set=23 {ch} {duty}
rpm=21 {ch} > u16be@2

[temps]
count=4
read=11 {ch} > s16be@2 /100
