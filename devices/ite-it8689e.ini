[device]
name=ITE IT8689E
type=sio
status=untested
tested=
source=Linux drivers/hwmon/it87.c, frankcrawford/it87 it87.c, LibreHardwareMonitor IT87XX.cs, LpcIO.cs, Chip.cs
family=ite
chip=8689
ldn=04
; No control while all fans are off with active-low polarity (reg 14): the
; BIOS left the fan outputs unconfigured (Linux it87_check_pwm).
; No control unless bank 0 is selected (reg 06).
guard=06:60=00,14:87!=00

[fans]
; All registers are in bank 0 (reg 06 bits 6 and 5 clear). frankcrawford it87.c
; selects it before each access, LibreHardwareMonitor does not on this chip.
; Blackout does not change the bank: see guard.
; Fan 1 to 3 follow the duty only while their bit in reg 13 is set (enable).
; Fan 2 to 6 exist only if the board routes those pins.
; Manual mode needs 7F in the mode register (LibreHardwareMonitor).
; Clearing bit 7 alone leaves the duty register ignored.
Fan 1=duty:63 mode:15 manual:FF=7F enable:13.0 rpm:0D,18
Fan 2=duty:6B mode:16 manual:FF=7F enable:13.1 rpm:0E,19
Fan 3=duty:73 mode:17 manual:FF=7F enable:13.2 rpm:0F,1A
Fan 4=duty:7B mode:7F manual:FF=7F rpm:80,81
Fan 5=duty:A3 mode:A7 manual:FF=7F rpm:82,83
Fan 6=duty:AB mode:AF manual:FF=7F rpm:4C,4D

[temps]
; Temp 4 to 6 share 2C to 2E with voltage inputs. Each is a temperature
; only when its 2-bit field in reg 77 (bits 1 and 0, 3 and 2, 5 and 4) is 2 or 3.
Temp 1=29
Temp 2=2A
Temp 3=2B
Temp 4=2C
Temp 5=2D
Temp 6=2E
