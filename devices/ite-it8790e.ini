[fans]
; Second chip on Gigabyte boards, config port 4E. The BIOS leaves it in
; config mode. Blackout asks for the ID before it sends any key, and never
; sends the exit sequence to port 4E.
; RPM only. Linux takes the duty in 63, 6B, 73, LibreHardwareMonitor
; writes a 7-bit duty to 15, 16, 17.
Fan 1=rpm:0D,18
Fan 2=rpm:0E,19
Fan 3=rpm:0F,1A

[temps]
Temp 1=29
Temp 2=2A
Temp 3=2B
