[device]
name=Nuvoton NCT6686D
type=sio
status=untested
tested=
source=Linux drivers/hwmon/nct6683.c, Fred78290/nct6687d nct6687.c, LibreHardwareMonitor Nct677X.cs and LpcIO.cs
family=nct6683
chip=D44
ldn=0B

[fans]
; RPM only. Control needs the EC request/commit sequence (A01)
; and a per-fan bit in shared register A00.
; 16 fan inputs in chip order. Which ones are wired depends on the board.
Fan 1=rpm:140
Fan 2=rpm:142
Fan 3=rpm:144
Fan 4=rpm:146
Fan 5=rpm:148
Fan 6=rpm:14A
Fan 7=rpm:14C
Fan 8=rpm:14E
Fan 9=rpm:150
Fan 10=rpm:152
Fan 11=rpm:154
Fan 12=rpm:156
Fan 13=rpm:158
Fan 14=rpm:15A
Fan 15=rpm:15C
Fan 16=rpm:15E

[temps]
; Slot use is set by board firmware (source code in register 1A0+n).
; These are the slots nct6687d and LibreHardwareMonitor read as temperatures.
Temp 1=100,101.7
Temp 2=102,103.7
Temp 3=104,105.7
Temp 4=106,107.7
Temp 5=108,109.7
Temp 6=10A,10B.7
Temp 7=10C,10D.7
