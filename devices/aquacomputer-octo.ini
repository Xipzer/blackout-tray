; Aquacomputer Octo fan controller. Monitor only.
; The controller sends input report 01 every second on its own, no init command.
;
; Offsets: numbered reports. aquacomputer_d5next.c (raw_event buffer) and liquidctl
; (hidapi read) both have report ID 01 at index 0, the same as Windows. No conversion.
; RPM = fan block start + 8: blocks at 7D, 8A, 97, A4, B1, BE, CB, D8 give
; 133, 146, 159, 172, 185, 198, 211, 224.
; Temperature sensors start at 3D = 61, two bytes each.
; in: the status report is 147 = 327 bytes including the report ID.
;
; id= and out= are left out: the sources define no output report. Speed is set
; through feature report 03 (1631 bytes, CRC-16/USB), which this format cannot send.
; The 16 software sensors (45 onward) and the flow sensor (7B) are left out.

[device]
name=Aquacomputer Octo
type=hid
status=untested
tested=
source=linux drivers/hwmon/aquacomputer_d5next.c, liquidctl liquidctl/driver/aquacomputer.py, liquidctl docs/developer/protocol/aquacomputer.md
vid=0C70
pid=F011
in=326

[fans]
listen=1
match=01
Fan 1=u16be@133
Fan 2=u16be@146
Fan 3=u16be@159
Fan 4=u16be@172
Fan 5=u16be@185
Fan 6=u16be@198
Fan 7=u16be@211
Fan 8=u16be@224

[temps]
listen=1
match=01
invalid=7FFF
Sensor 1=u16be@61 /100
Sensor 2=u16be@63 /100
Sensor 3=u16be@65 /100
Sensor 4=u16be@67 /100
