[fans]
; RPM only. Control needs the EC request/commit sequence (A01, CF8)
; and a per-fan bit in shared register A00.
; Also matches NCT6687D-R (same ID, MSI B840 B850 B860 X870 Z890 boards).
; 140 CPU fan, 142 pump fan. System fans 1 to 6: 144 to 14E on NCT6687D,
; 15E down to 154 on NCT6687D-R.
